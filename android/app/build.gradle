plugins { id 'com.android.application' }
android {
    namespace 'com.frowndotorg.leaveby'
    compileSdk 35
    sourceSets { main { assets.srcDirs += ['../../design'] } }
    defaultConfig {
        applicationId 'com.frowndotorg.leaveby'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.3.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
