name: LeaveBy
options:
  bundleIdPrefix: com.leaveby
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LeaveBy:
    type: application
    platform: iOS
    sources: [LeaveBy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leaveby.planner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  LeaveBy:
    build:
      targets:
        LeaveBy: all
