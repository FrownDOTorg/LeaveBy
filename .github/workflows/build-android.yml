name: Build Android
on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse test signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: leaveby-android-debug-signing-v1
      - name: Test and build Android
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LeaveBy-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
